name: Android EAS Build

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Set up Expo / EAS
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 5. Build Android
      - name: Build Android via EAS
        run: |
          eas build \
            --profile production \
            --platform android \
            --non-interactive

      # 6. Report
      - name: Report build result
        if: always()
        run: |
          echo "=== EAS Build Summary ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "=== End of Build Summary ==="
